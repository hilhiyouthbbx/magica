name: apply-patch
on:
  push:
    paths:
      - '.github/patches/**'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patches
        run: |
          set -e
          for p in .github/patches/*.patch; do
            git apply --whitespace=nowarn "$p"
          done
          git rm -rf -q .github/patches
          git config user.name "patch-bot"
          git config user.email "patch-bot@users.noreply.github.com"
          git add -A
          git commit -m "Tryout reminder: apply countdown wording"
          git push
