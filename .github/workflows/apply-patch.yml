name: Apply patch
on:
  push:
    paths:
      - 'patches/*.patch'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply and remove patches
        run: |
          shopt -s nullglob
          files=(patches/*.patch)
          if [ ${#files[@]} -eq 0 ]; then echo "no patches"; exit 0; fi
          for p in "${files[@]}"; do git apply --unidiff-zero --whitespace=nowarn "$p"; git rm -q "$p"; done
          git config user.name "hilhiyouthbbx"
          git config user.email "info@hilhiyouthbbx.com"
          git add -A
          git commit -m "Apply patch: voucher edit scroll"
          git push
