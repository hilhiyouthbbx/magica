name: apply-patch
on:
  push:
    paths:
      - '.github/patches/**'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patches and add dependency
        run: |
          set -e
          for p in .github/patches/*.patch; do
            git apply --unidiff-zero --whitespace=nowarn "$p"
          done
          npm install @anthropic-ai/sdk@^1.0.0 --no-audit --no-fund
          git rm -rf -q .github/patches
          git config user.name "patch-bot"
          git config user.email "patch-bot@users.noreply.github.com"
          git add -A
          git commit -m "Email blast: add Write with AI button and Anthropic SDK dependency"
          git push
